<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>퇴근 요정 설정</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <!-- 근무 유형: 둘 다 해제면 일반근무 -->
  <div class="row types">
    <label><input type="checkbox" id="half"> 반차</label>
    <label><input type="checkbox" id="flex"> 유연근무</label>
    <span id="flexTime" hidden>
      <input type="number" id="flexH" min="1" max="23"> :
      <input type="number" id="flexM" min="0" max="59" step="5">
    </span>
  </div>

  <h2>업무 시작 시각</h2>
  <div class="row">
    <span id="startClock" class="big">--:--</span>
    <button id="editStart" class="ghost">수정</button>
  </div>
  <div id="startEditor" hidden>
    <div class="row">
      <input type="time" id="manualTime">
      <button id="saveStart" class="primary">저장</button>
    </div>
    <div class="row chips">
      <button id="useBoot" class="chip"></button>
      <button id="useBoot10" class="chip"></button>
    </div>
  </div>
  <div id="endLine" class="muted"></div>
  <div id="error" class="error"></div>

  <h2>체크리스트</h2>
  <form id="todoForm" class="row">
    <input id="todoInput" maxlength="100" placeholder="할 일을 적고 Enter" autocomplete="off">
    <button type="submit" class="primary">추가</button>
  </form>
  <div id="todoError" class="error"></div>
  <ul id="todoList"></ul>

  <details id="widget">
    <summary>위젯 설정</summary>
    <div class="range"><span>크기</span><input type="range" id="scale" min="70" max="150" step="10"><output id="scaleOut"></output></div>
    <div class="range"><span>투명도</span><input type="range" id="opacity" min="30" max="100" step="10"><output id="opacityOut"></output></div>
    <div class="range"><span>할 일 확인</span>
      <select id="nudgeFreq">
        <option value="off">끄기</option>
        <option value="low">가끔 (2~3시간)</option>
        <option value="normal">보통 (1.5~2시간)</option>
        <option value="high">자주 (1~1.5시간)</option>
      </select>
      <button id="nudgeOn" class="chip" hidden>오늘 다시 켜기</button>
    </div>
    <label><input type="checkbox" id="mouseReact"> 마우스 따라 쳐다보기</label>
    <label><input type="checkbox" id="hidden"> 요정 숨기기 <span class="muted" id="shortcut"></span></label>
    <label><input type="checkbox" id="autoStart"> 컴퓨터 켤 때 자동 실행</label>
  </details>

  <script src="settings.js"></script>
</body>
</html>
