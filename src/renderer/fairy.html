<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>퇴근 요정</title>
  <link rel="stylesheet" href="fairy.css">
</head>
<body>
  <div id="stage">
    <!-- 말풍선: 퇴근 알림 또는 클릭 시 상세 정보 -->
    <div id="bubble" class="hit" hidden>
      <div id="bubbleText"></div>
      <div id="bubbleButtons"></div>
    </div>

    <!-- 빠른 할 일 추가: + 버튼 → 입력칸, Enter로 추가(계속 입력 가능), Esc로 닫기 -->
    <form id="quickAdd" class="hit" hidden>
      <input id="quickInput" maxlength="100" placeholder="할 일을 적고 Enter" autocomplete="off">
      <div id="quickMsg">Enter 추가 · Esc 닫기</div>
    </form>

    <button id="add" class="hit corner" title="할 일 추가">+</button>
    <button id="gear" class="hit corner" title="설정">⚙</button>

    <div id="fairy" class="hit" title="클릭: 자세히 보기 · 드래그: 이동">
      <!-- 요정 그림(assets/fairy.png, 원본 좌표 516×800) 위에 LCD 글자와 눈을 덧그림 -->
      <svg viewBox="0 0 516 800" width="110" height="170" aria-hidden="true">
        <image href="../../assets/fairy.png" x="0" y="0" width="516" height="800" />
        <!-- 이마 LCD 타이머 -->
        <text id="lcd" x="257" y="222" text-anchor="middle">--:--</text>
        <!-- 눈: 마우스를 따라 움직임, 타이머 종료 시 감음 -->
        <g id="eyes">
          <g class="eye-open">
            <ellipse cx="146" cy="302" rx="9" ry="16" /><circle class="glint" cx="149" cy="295" r="3.5" />
            <ellipse cx="369" cy="303" rx="9" ry="16" /><circle class="glint" cx="372" cy="296" r="3.5" />
          </g>
          <g class="eye-closed">
            <path d="M131 304 Q146 316 161 304" /><path d="M354 305 Q369 317 384 305" />
          </g>
        </g>
      </svg>
    </div>
  </div>
  <script src="fairy.js"></script>
</body>
</html>
