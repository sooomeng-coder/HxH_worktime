# 설치 파일 만들기: GitHub 저장소 → Actions → "설치 파일 만들기" → Run workflow
# (또는 v1.0.0 같은 태그를 push). 완료되면 실행 결과 아래 Artifacts에서 내려받기
name: 설치 파일 만들기

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            # 설치 전 실행 파일로 실제 실행 확인
            smoke: dist/win-unpacked/*.exe
          - os: macos-latest # Apple 실리콘(M칩) 러너
            target: --mac
            smoke: dist/mac-arm64/*.app/Contents/MacOS/*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # 코드 서명 없이 빌드
      # 만든 앱이 켜지자마자 꺼지지 않는지 10초간 실행해 확인 (실패 시 원인 정보 출력)
      - name: 실행 확인
        shell: bash
        run: scripts/smoke.sh "$(ls -d ${{ matrix.smoke }} | head -1)"
      - uses: actions/upload-artifact@v6
        with:
          name: 퇴근요정-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
