# 설치 파일 만들기: GitHub 저장소 → Actions → "설치 파일 만들기" → Run workflow
# (또는 v1.0.0 같은 태그를 push). 완료되면 실행 결과 아래 Artifacts에서 내려받기
name: 설치 파일 만들기

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # 코드 서명 없이 빌드
      - uses: actions/upload-artifact@v4
        with:
          name: 퇴근요정-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
